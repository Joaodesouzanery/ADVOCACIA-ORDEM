name: sondagem
on:
  push:
    paths:
      - "src/ordem/data/fontes.json"
      - "src/ordem/sondagem.py"
      - "src/ordem/connectors/http.py"
      - ".github/workflows/sondagem.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sondagem
  cancel-in-progress: false
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[ingest]"
      - name: Sondar fontes de dados abertos
        run: ordem sondar
      - name: Commit do relatório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sondagem
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "Sondagem das fontes ($(date -u +%F))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
