[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordem"
version = "0.1.0"
description = "Base jurídica de dados abertos (legislação + tribunais) com prazos processuais, exposta via MCP"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
ingest = ["httpx>=0.27", "beautifulsoup4>=4.12"]
db = ["supabase>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
ordem = "ordem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ordem = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
